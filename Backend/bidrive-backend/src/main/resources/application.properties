spring.application.name=bidrive-backend

server.port=8080

# === Подключение к БД ===
spring.datasource.url=jdbc:postgresql://localhost:5432/bidrive
spring.datasource.username=postgres
spring.datasource.password=Pg_2026
spring.datasource.driver-class-name=org.postgresql.Driver

# === HikariCP (пул соединений с БД) ===
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# === Оптимизация производительности (Java 25 + Spring 4.0.6) ===
# ВКЛЮЧАЕМ виртуальные потоки — это даст самый большой прирост скорости обработки запросов
spring.threads.virtual.enabled=true

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=validate

# Ускоряем запуск: отключаем подробные логи Hibernate (включаю только при отладке!)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# === Batch операции (ускоряют массовые вставки/обновления) ===
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# === Лимиты загрузки файлов ===
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# === Telegram Bot Settings ===
telegram.bot.token=7710681798:AAG3mwBKAiGfnTsKxNRdi6E1ZY_mtjxGABA
