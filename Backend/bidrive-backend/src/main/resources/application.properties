spring.application.name=bidrive-backend

server.port=8080

# === Подключение к БД ===
spring.datasource.url=jdbc:postgresql://localhost:5432/bidrive
spring.datasource.username=postgres
spring.datasource.password=Pg_2026
spring.datasource.driver-class-name=org.postgresql.Driver

# === Оптимизация производительности (Java 25 + Spring 4.0.5) ===
# ВКЛЮЧАЕМ виртуальные потоки — это даст самый большой прирост скорости обработки запросов
spring.threads.virtual.enabled=true

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=validate

# Ускоряем запуск: отключаем подробные логи Hibernate (включаю только при отладке!)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# === Лимиты загрузки файлов ===
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

