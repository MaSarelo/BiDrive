<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/Icon-BiDrive.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BiDrive</title>

  <script>
    // Проверяем сохраненную тему в localStorage ДО загрузки CSS/React
    try {
      var savedTheme = localStorage.getItem('theme');
      // Если тема 'light', сразу добавляем класс на HTML-элемент
      if (savedTheme === 'light') {
        document.documentElement.classList.add('light-theme');
      }
    } catch (e) {}
  </script>

</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
